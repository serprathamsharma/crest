[project]
name = "crest"
version = "0.1.0"
description = "Diagnostic machine learning benchmark, feature selection, and confusion matrix calibration for Wisconsin Breast Cancer dataset"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]
